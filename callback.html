<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Activando VIP...</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
  }
</style>
</head>
<body>

<h2>Activando tu VIP...</h2>
<p>Un momento por favor...</p>

<script>
const backend = "https://backend-premium-production-29b1.up.railway.app";

// Obtener el "code" de Patreon
const params = new URLSearchParams(window.location.search);
const code = params.get("code");

if (!code) {
    document.body.innerHTML = "<h3>Error: falta el código de Patreon.</h3>";
} else {
    // Redirigir directamente al backend (sin fetch)
    window.location.href = `${backend}/callback?code=${code}`;
}
</script>

</body>
</html>
