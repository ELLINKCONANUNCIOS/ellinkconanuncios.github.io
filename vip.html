<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zona VIP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    h2 { font-size: 32px; margin-bottom: 10px; }

    .box {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      max-width: 650px;
      margin: 0 auto;
      border: 1px solid #333;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin: 10px;
      transition: 0.3s;
      color: white;
    }

    .btn-patreon { background: #e67e22; }
    .btn-patreon:hover { background: #d35400; transform: scale(1.05); }

    .btn-catalogo { background: #3498db; }
    .btn-catalogo:hover { background: #2980b9; transform: scale(1.05); }

    .vip-ok {
      background: #2ecc71;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .vip-no {
      background: #c0392b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .beneficios {
      text-align: left;
      margin-top: 20px;
      padding: 15px;
      background: #222;
      border-radius: 10px;
    }

    .beneficios h3 {
      margin-bottom: 10px;
      color: #f1c40f;
    }

    .beneficios ul {
      list-style: none;
      padding: 0;
    }

    .beneficios li {
      padding: 6px 0;
      font-size: 16px;
    }

    #gojoCanvas {
      width: 100%;
      max-width: 600px;
      height: 300px;
      background: transparent;
      border-radius: 10px;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>

<h2>Zona VIP</h2>

<div class="box">

  <!-- Estado VIP -->
  <div id="estadoVIP"></div>

  <!-- Botón Patreon -->
  <a id="btnPatreon"
     href="https://backend-premium-production-cef8.up.railway.app/login"
     class="btn btn-patreon">
     Iniciar sesión con Patreon
  </a>

  <!-- Botón Cerrar Sesión VIP -->
  <a id="btnLogoutVIP"
     href="https://backend-premium-production-cef8.up.railway.app/logout-vip"
     class="btn btn-patreon"
     style="background:#c0392b; display:none;">
     Cerrar sesión VIP
  </a>

  <!-- Botón Volver al catálogo -->
  <a id="btnCatalogo"
     href="index.html"
     class="btn btn-catalogo">
     ← Volver al catálogo
  </a>

  <!-- Beneficios VIP -->
  <div id="beneficiosVIP" class="beneficios">
    <h3>Beneficios VIP</h3>
    <ul>
      <li>✔ Descargas sin anuncios</li>
      <li>✔ Enlaces directos premium</li>
      <li>✔ Acceso anticipado a nuevos juegos</li>
      <li>✔ Soporte prioritario</li>
    </ul>
  </div>

</div>

<script>

const backend =
  "https://backend-premium-production-cef8.up.railway.app";

const params =
  new URLSearchParams(window.location.search);

const estadoVIP =
  document.getElementById("estadoVIP");

const btnPatreon =
  document.getElementById("btnPatreon");

const btnLogoutVIP =
  document.getElementById("btnLogoutVIP");


// =========================
// ERROR DE LOGIN
// =========================

if (params.has("login_error")) {

  estadoVIP.innerHTML = `
    <div class="vip-no">
      ✖ No se pudo iniciar sesión con Patreon.
      Inténtalo nuevamente.
    </div>
  `;

  btnPatreon.style.display = "inline-block";
  btnLogoutVIP.style.display = "none";

}


// =========================
// NO TIENE MEMBRESÍA
// =========================

else if (params.has("no_membresia")) {

  estadoVIP.innerHTML = `
    <div class="vip-no">
      ✖ No tienes una membresía activa en Patreon.
      Debes suscribirte para acceder al contenido VIP.
    </div>
  `;

  btnPatreon.style.display = "inline-block";
  btnLogoutVIP.style.display = "none";

}


// =========================
// COMPROBAR VIP
// =========================

else {

  fetch(
    backend + "/vip-check",
    {
      credentials: "include"
    }
  )

  .then(response => {

    if (!response.ok) {
      throw new Error("Error del servidor");
    }

    return response.json();

  })

  .then(data => {

    // =========================
    // NO VIP
    // =========================

    if (!data.vip) {

      estadoVIP.innerHTML = `
        <div class="vip-no">
          ✖ No eres VIP — Inicia sesión con Patreon
          para desbloquear el contenido.
        </div>
      `;

      btnPatreon.style.display = "inline-block";
      btnLogoutVIP.style.display = "none";

      return;
    }


    // =========================
    // SÍ VIP
    // =========================

    estadoVIP.innerHTML = `
      <div class="vip-ok">
        ✔ Eres VIP — Acceso completo desbloqueado
      </div>
    `;

    btnPatreon.style.display = "none";
    btnLogoutVIP.style.display = "inline-block";

  })

  .catch(error => {

    console.error(
      "Error comprobando VIP:",
      error
    );

    estadoVIP.innerHTML = `
      <div class="vip-no">
        ✖ No se pudo comprobar tu membresía.
        Inténtalo nuevamente.
      </div>
    `;

    btnPatreon.style.display = "inline-block";
    btnLogoutVIP.style.display = "none";

  });

}

</script>
