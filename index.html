<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Catálogo de Juegos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    background: #111;
    color: white;
    font-family: Arial;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 30px;
  }

  /* ===== CATÁLOGO ===== */
  .catalogo {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }

  .juego-card {
    background: #1e1e1e;
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
  }

  .juego-card:hover {
    background: #2a2a2a;
    transform: scale(1.03);
  }

  .juego-card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 10px;
  }

  /* ===== PAGINACIÓN ===== */
  .paginacion {
    margin-top: 35px;
    text-align: center;
    font-size: 18px;
  }

  .paginacion span {
    display: inline-block;
    margin: 0 8px;
    padding: 8px 12px;
    background: #1e1e1e;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
  }

  .paginacion span:hover {
    background: #2a2a2a;
  }

  .activa {
    background: #3498db;
  }
.btn-vip {
  display: inline-block;
  background: #e67e22;
  padding: 10px 18px;
  border-radius: 8px;
  color: white;
  font-weight: bold;
  text-decoration: none;
  margin-bottom: 20px;
  transition: 0.3s;
  box-shadow: 0 0 10px rgba(0, 150, 255, 0.4);
  animation: vipPulse 2s infinite ease-in-out;
}

@keyframes vipPulse {
  0% { box-shadow: 0 0 10px rgba(0,150,255,0.4); }
  50% { box-shadow: 0 0 20px rgba(0,150,255,0.8); }
  100% { box-shadow: 0 0 10px rgba(0,150,255,0.4); }
}

.btn-vip:hover {
  background: #d35400;
  transform: scale(1.05);
}
.input-busqueda {
  width: 100%;
  max-width: 400px;
  padding: 12px 15px;
  margin: 0 auto 25px auto;
  display: block;
  border-radius: 8px;
  border: 1px solid #333;
  background: #1e1e1e;
  color: white;
  font-size: 16px;
  transition: 0.3s;
}

.input-busqueda:focus {
  outline: none;
  border-color: #3498db;
  box-shadow: 0 0 10px #3498db;
}

</style>

</head>
<body>

<a href="vip.html" class="btn-vip">Zona VIP</a>

<input type="text" id="buscador" placeholder="Buscar juego..." oninput="buscarJuego()" class="input-busqueda">

<h1>Catálogo de Juegos</h1>

<div id="catalogo" class="catalogo"></div>
<div id="paginacion" class="paginacion"></div>

<script>
const juegosPorPagina = 30;
let juegos = [];
let paginaActual = 1;

async function cargarJuegos() {
  try {
    const res = await fetch("juegos.json");
    juegos = await res.json();
    mostrarPagina(1);
  } catch (e) {
    console.error("Error cargando juegos.json:", e);
  }
}

function mostrarPagina(num) {
  paginaActual = num;

  const inicio = (num - 1) * juegosPorPagina;
  const fin = inicio + juegosPorPagina;
  const juegosPagina = juegos.slice(inicio, fin);

  document.getElementById("catalogo").innerHTML = juegosPagina.map(j => `
    <div class="juego-card" onclick="location.href='${j.link}'">
      <img src="${j.imagen}">
      <h3>${j.titulo}</h3>
      <p>${j.version} • ${j.idioma} • ${j.plataformas}</p>
    </div>
  `).join("");

  generarPaginacion();
}

function generarPaginacion() {
  const totalPaginas = Math.ceil(juegos.length / juegosPorPagina);
  let html = "";

  // Página 1
  html += `<span class="${paginaActual === 1 ? 'activa' : ''}" onclick="mostrarPagina(1)">1</span>`;

  // Página 2 solo si existe
  if (totalPaginas >= 2) {
    html += `<span class="${paginaActual === 2 ? 'activa' : ''}" onclick="mostrarPagina(2)">2</span>`;
  }

  // Mostrar "..." solo si hay más de 3 páginas
  if (totalPaginas > 3) {
    html += `<span>...</span>`;
  }

  // Última página (solo si es mayor que 2)
  if (totalPaginas > 2) {
    html += `<span class="${paginaActual === totalPaginas ? 'activa' : ''}" onclick="mostrarPagina(${totalPaginas})">${totalPaginas}</span>`;
  }

  // Botón siguiente
  if (paginaActual < totalPaginas) {
    html += `<span onclick="mostrarPagina(${paginaActual + 1})">Siguiente →</span>`;
  }

  document.getElementById("paginacion").innerHTML = html;
}
function buscarJuego() {
  const texto = document.getElementById("buscador").value.toLowerCase();

  if (texto.trim() === "") {
    mostrarPagina(1);
    return;
  }

  const filtrados = juegos.filter(j =>
    j.titulo.toLowerCase().includes(texto)
  );

  document.getElementById("catalogo").innerHTML = filtrados.map(j => `
    <div class="juego-card" onclick="location.href='${j.link}'">
      <img src="${j.imagen}">
      <h3>${j.titulo}</h3>
      <p>${j.version} • ${j.idioma} • ${j.plataformas}</p>
    </div>
  `).join("");

  document.getElementById("paginacion").innerHTML = "";
}

cargarJuegos();
</script>

</body>
</html>
