<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Catálogo de Juegos</title>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<style>

/* ==========================================
   GENERAL
========================================== */

body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
  margin: 0;
}


/* ==========================================
   TÍTULO
========================================== */

h1 {
  text-align: center;
  margin-bottom: 25px;
}


/* ==========================================
   BOTÓN VIP
========================================== */

.btn-vip {
  display: inline-block;
  background: #e67e22;
  padding: 10px 18px;
  border-radius: 8px;
  color: white;
  font-weight: bold;
  text-decoration: none;
  margin-bottom: 20px;
  transition: 0.3s;

  box-shadow:
    0 0 10px rgba(0, 150, 255, 0.4);

  animation:
    vipPulse 2s infinite ease-in-out;
}


@keyframes vipPulse {

  0% {
    box-shadow:
      0 0 10px rgba(0,150,255,0.4);
  }

  50% {
    box-shadow:
      0 0 20px rgba(0,150,255,0.8);
  }

  100% {
    box-shadow:
      0 0 10px rgba(0,150,255,0.4);
  }

}


.btn-vip:hover {
  background: #d35400;
  transform: scale(1.05);
}


/* ==========================================
   BUSCADOR
========================================== */

.input-busqueda {

  width: 100%;

  max-width: 400px;

  padding: 12px 15px;

  margin:
    0 auto 20px auto;

  display: block;

  box-sizing: border-box;

  border-radius: 8px;

  border: 1px solid #333;

  background: #1e1e1e;

  color: white;

  font-size: 16px;

  transition: 0.3s;
}


.input-busqueda:focus {

  outline: none;

  border-color: #3498db;

  box-shadow:
    0 0 10px #3498db;

}


/* ==========================================
   CATEGORÍAS
========================================== */

.categorias {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 10px;

  flex-wrap: wrap;

  margin-bottom: 30px;
}


.categoria-btn {

  background: #1e1e1e;

  color: white;

  border: 1px solid #333;

  padding: 10px 18px;

  border-radius: 8px;

  cursor: pointer;

  font-size: 15px;

  transition: 0.3s;
}


.categoria-btn:hover {

  background: #2a2a2a;

  transform:
    translateY(-2px);
}


.categoria-btn.activa {

  background: #3498db;

  border-color: #3498db;
}


/* ==========================================
   ANUNCIO
========================================== */

.anuncio-adsterra {
  width: 100%;
  max-width: 900px;
  margin: 0 auto 30px auto;
  text-align: center;
  overflow: hidden;
}

/* ==========================================
   CATÁLOGO
   PC = 4 JUEGOS POR FILA
========================================== */

.catalogo {

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 20px;

  width: 100%;
}


/* ==========================================
   TARJETAS
========================================== */

.juego-card {

  background: #1e1e1e;

  padding: 15px;

  border-radius: 10px;

  cursor: pointer;

  transition: 0.3s;

  min-width: 0;

  box-sizing: border-box;
}


.juego-card:hover {

  background: #2a2a2a;

  transform:
    scale(1.03);
}


.juego-card img {

  width: 100%;

  height: 140px;

  object-fit: cover;

  border-radius: 10px;

  display: block;
}


.juego-card h3 {

  margin-top: 15px;

  margin-bottom: 8px;

  line-height: 1.3;
}


.juego-card p {

  color: #bbb;

  line-height: 1.4;
}


/* ==========================================
   ETIQUETA DE CATEGORÍA
========================================== */

.categoria {

  display: inline-block;

  background: #3498db;

  color: white;

  font-size: 12px;

  font-weight: bold;

  padding: 5px 9px;

  border-radius: 5px;

  margin-top: 5px;
}


/* ==========================================
   PAGINACIÓN
========================================== */

.paginacion {

  margin-top: 35px;

  text-align: center;

  font-size: 18px;
}


.paginacion span {

  display: inline-block;

  margin: 0 8px;

  padding: 8px 12px;

  background: #1e1e1e;

  border-radius: 6px;

  cursor: pointer;

  transition: 0.3s;
}


.paginacion span:hover {

  background: #2a2a2a;
}


.paginacion .activa {

  background: #3498db;
}


/* ==========================================
   TABLET
   2 JUEGOS POR FILA
========================================== */

@media (max-width: 1000px) {

  .catalogo {

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 15px;
  }

}


/* ==========================================
   TELÉFONO
   2 JUEGOS POR FILA
========================================== */

@media (max-width: 600px) {

  body {

    padding: 15px;

  }


  h1 {

    font-size: 28px;

    margin-bottom: 20px;

  }


  .catalogo {

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 12px;

  }


  .juego-card {

    padding: 10px;

    border-radius: 8px;

  }


  .juego-card img {

    height: 105px;

    border-radius: 7px;

  }


  .juego-card h3 {

    font-size: 15px;

    margin-top: 10px;

    margin-bottom: 7px;

  }


  .juego-card p {

    font-size: 12px;

    margin-bottom: 5px;

  }


  .categoria {

    font-size: 11px;

    padding: 4px 7px;

  }


  .categoria-btn {

    padding: 9px 14px;

    font-size: 14px;

  }


  .paginacion {

    font-size: 15px;

  }


  .paginacion span {

    margin: 3px;

    padding: 7px 9px;

  }

}

</style>

</head>


<body>


<!-- ==========================================
     ZONA VIP
========================================== -->

<a
  href="vip.html"
  class="btn-vip"
>
  Zona VIP
</a>


<!-- ==========================================
     BUSCADOR
========================================== -->

<input
  type="text"
  id="buscador"
  placeholder="Buscar juego..."
  oninput="actualizarCatalogo()"
  class="input-busqueda"
>


<!-- ==========================================
     TÍTULO
========================================== -->

<h1>
  Catálogo de Juegos
</h1>


<!-- ==========================================
     CATEGORÍAS
========================================== -->

<div class="categorias">


  <button
    class="categoria-btn activa"
    onclick="
      seleccionarCategoria(
        'Todos',
        this
      )
    "
  >
    Todos
  </button>


  <button
    class="categoria-btn"
    onclick="
      seleccionarCategoria(
        '3D',
        this
      )
    "
  >
    3D
  </button>


  <button
    class="categoria-btn"
    onclick="
      seleccionarCategoria(
        '2D',
        this
      )
    "
  >
    2D
  </button>


  <button
    class="categoria-btn"
    onclick="
      seleccionarCategoria(
        'Pixel Art',
        this
      )
    "
  >
    Pixel Art
  </button>


</div>


<!-- ==========================================
     ANUNCIO ADSTERRA
========================================== -->
<script>
  atOptions = {
    'key' : '9cb87cf95b9d0c89cf81fb65d8b21c59',
    'format' : 'iframe',
    'height' : 250,
    'width' : 300,
    'params' : {}
  };
</script>
<script src="https://biomanos.org/22/9cb87cf95b9d0c89cf81fb65d8b21c59"></script>

<!-- ==========================================
     CATÁLOGO
========================================== -->

<div
  id="catalogo"
  class="catalogo"
></div>


<!-- ==========================================
     PAGINACIÓN
========================================== -->

<div
  id="paginacion"
  class="paginacion"
></div>


<script>


/* ==========================================
   CONFIGURACIÓN
========================================== */

const juegosPorPagina = 30;

let juegos = [];

let paginaActual = 1;

let categoriaActual = "Todos";


/* ==========================================
   CARGAR JUEGOS
========================================== */

async function cargarJuegos() {

  try {

    const res =
      await fetch("juegos.json");


    if (!res.ok) {

      throw new Error(
        "No se pudo cargar juegos.json"
      );

    }


    juegos =
      await res.json();


    mostrarPagina(1);


  } catch (e) {

    console.error(
      "Error cargando juegos.json:",
      e
    );


    document
      .getElementById("catalogo")
      .innerHTML = `

        <p style="
          text-align:center;
          color:#ff6b6b;
          grid-column:1/-1;
        ">
          No se pudieron cargar los juegos.
          <br>
          Revisa que el archivo
          <strong>juegos.json</strong>
          esté en la misma carpeta que
          <strong>index.html</strong>.
        </p>

    `;

  }

}


/* ==========================================
   SELECCIONAR CATEGORÍA
========================================== */

function seleccionarCategoria(
  categoria,
  boton
) {

  categoriaActual =
    categoria;


  paginaActual = 1;


  document
    .querySelectorAll(
      ".categoria-btn"
    )
    .forEach(btn => {

      btn.classList.remove(
        "activa"
      );

    });


  boton.classList.add(
    "activa"
  );


  actualizarCatalogo();

}


/* ==========================================
   OBTENER JUEGOS FILTRADOS
========================================== */

function obtenerJuegosFiltrados() {


  const texto =

    document
      .getElementById(
        "buscador"
      )
      .value
      .toLowerCase()
      .trim();


  return juegos.filter(j => {


    const coincideCategoria =

      categoriaActual === "Todos" ||

      j.categoria ===
        categoriaActual;


    const coincideBusqueda =

      String(
        j.titulo || ""
      )
      .toLowerCase()
      .includes(texto);


    return (
      coincideCategoria &&
      coincideBusqueda
    );


  });

}


/* ==========================================
   ACTUALIZAR CATÁLOGO
========================================== */

function actualizarCatalogo() {

  paginaActual = 1;

  mostrarPagina(1);

}


/* ==========================================
   MOSTRAR PÁGINA
========================================== */

function mostrarPagina(num) {


  paginaActual = num;


  const juegosFiltrados =

    obtenerJuegosFiltrados();


  const inicio =

    (num - 1) *
    juegosPorPagina;


  const fin =

    inicio +
    juegosPorPagina;


  const juegosPagina =

    juegosFiltrados.slice(
      inicio,
      fin
    );


  document
    .getElementById(
      "catalogo"
    )
    .innerHTML =


    juegosPagina
      .map(j => `

        <div
          class="juego-card"
          onclick="
            location.href='${j.link}'
          "
        >


          <img
            src="${j.imagen}"
            alt="${j.titulo}"
          >


          <h3>
            ${j.titulo}
          </h3>


          <span class="categoria">

            ${
              j.categoria ||
              "Sin categoría"
            }

          </span>


          <p>

            ${
              j.version || ""
            }

            •

            ${
              j.idioma || ""
            }

            •

            ${
              j.plataformas || ""
            }

          </p>


        </div>

      `)
      .join("");


  generarPaginacion(
    juegosFiltrados.length
  );

}


/* ==========================================
   PAGINACIÓN
========================================== */

function generarPaginacion(
  totalJuegos
) {


  const totalPaginas =

    Math.ceil(
      totalJuegos /
      juegosPorPagina
    );


  let html = "";


  if (totalPaginas <= 1) {

    document
      .getElementById(
        "paginacion"
      )
      .innerHTML = "";


    return;

  }


  /* ========================================
     PÁGINA 1
  ======================================== */

  html += `

    <span
      class="${
        paginaActual === 1
          ? "activa"
          : ""
      }"

      onclick="
        mostrarPagina(1)
      "
    >
      1
    </span>

  `;


  /* ========================================
     PÁGINA 2
  ======================================== */

  if (
    totalPaginas >= 2
  ) {

    html += `

      <span
        class="${
          paginaActual === 2
            ? "activa"
            : ""
        }"

        onclick="
          mostrarPagina(2)
        "
      >
        2
      </span>

    `;

  }


  /* ========================================
     ...
  ======================================== */

  if (
    totalPaginas > 3
  ) {

    html += `

      <span>
        ...
      </span>

    `;

  }


  /* ========================================
     ÚLTIMA PÁGINA
  ======================================== */

  if (
    totalPaginas > 2
  ) {

    html += `

      <span

        class="${
          paginaActual ===
          totalPaginas
            ? "activa"
            : ""
        }"

        onclick="
          mostrarPagina(
            ${totalPaginas}
          )
        "

      >

        ${totalPaginas}

      </span>

    `;

  }


  /* ========================================
     SIGUIENTE
  ======================================== */

  if (
    paginaActual <
    totalPaginas
  ) {

    html += `

      <span

        onclick="
          mostrarPagina(
            ${paginaActual + 1}
          )
        "

      >

        Siguiente →

      </span>

    `;

  }


  document
    .getElementById(
      "paginacion"
    )
    .innerHTML = html;

}


/* ==========================================
   INICIAR
========================================== */

cargarJuegos();


</script>


</body>

</html>
