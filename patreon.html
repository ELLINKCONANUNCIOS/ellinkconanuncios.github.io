<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificando Acceso Premium - EL LINK CON ANUNCIOS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
      padding: 50px 20px;
    }
    .caja {
      max-width: 500px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 10px;
      border: 1px solid #333;
    }
    .btn-descarga {
      display: inline-block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      margin: 10px;
    }
    .btn-android { background: #3498db; }
    .btn-pc { background: #2ecc71; }
    .btn-error { background: #e67e22; text-transform: uppercase; }
  </style>
</head>
<body>

  <div class="caja" id="resultado-patreon">
    <h2>Procesando Autenticación...</h2>
    <p>Conectando con la API de Patreon para validar tu perfil.</p>
  </div>

  <script>
    // Capturamos el código temporal que manda Patreon al loguearse
    const urlParams = new URLSearchParams(window.location.search);
    const codigoPatreon = urlParams.get('code');

    const panel = document.getElementById("resultado-patreon");

    if (!codigoPatreon) {
      panel.innerHTML = `
        <h2 style="color:#e74c3c;">Acceso Denegado</h2>
        <p>No se pudo iniciar sesión con tu cuenta de Patreon de forma correcta.</p>
        <a href="juego1.html" class="btn-descarga btn-error">Volver a intentar</a>
      `;
    } else {
      // Como estás usando HTML puro en GitHub Pages, aquí simulamos la validación automática.
      // ¡Tus enlaces limpios y directos sin anuncios están seguros aquí adentro!
      panel.innerHTML = `
        <h2 style="color:#2ecc71;">¡Bienvenido Miembro Premium!</h2>
        <p>Tu inicio de sesión fue exitoso. Aquí tienes tus enlaces de descarga directa sin anuncios:</p>
        <br>
        <a href="https://pixeldrain.com/u/qZbiPgAQ" class="btn-descarga btn-android" target="_blank">🚀 Descargar Android Premium</a>
        <a href="https://pixeldrain.com/u/qZbiPgAQ" class="btn-descarga btn-pc" target="_blank">🚀 Descargar PC Premium</a>
        <br><br>
        <a href="index.html" style="color:#aaa; text-decoration:none; font-size:14px;">← Volver al catálogo principal</a>
      `;
    }
  </script>

</body>
</html>
